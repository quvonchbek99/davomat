<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Davomat — Mashrapov Q.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Cpath d='M18 33l9 9 19-20' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5fb; --card:#ffffff; --ink:#151827; --muted:#6b7084; --line:#e6e8f0;
  --pri:#4f46e5; --pri2:#7c3aed; --pri-soft:#eef0ff;
  --ok:#16a34a; --ok-soft:#e3f7e9; --no:#dc2626; --no-soft:#fde2e1;
  --sab:#2563eb; --sab-soft:#e0ecff; --late:#d97706; --late-soft:#fff1d6;
  --daf:#9333ea; --daf-soft:#f3e8ff;
  --shadow:0 1px 2px rgba(20,24,60,.05),0 8px 24px rgba(20,24,60,.06);
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1020; --card:#171a2e; --ink:#eef0fb; --muted:#9a9fb8; --line:#262a44;
    --pri:#818cf8; --pri2:#a78bfa; --pri-soft:#1f2347;
    --ok:#4ade80; --ok-soft:#14301f; --no:#f87171; --no-soft:#3a1719;
    --sab:#60a5fa; --sab-soft:#15264a; --late:#fbbf24; --late-soft:#3a2a0c;
    --daf:#c084fc; --daf-soft:#2c1a40; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hide{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;
  background:radial-gradient(1200px 600px at 10% -10%,rgba(124,58,237,.25),transparent 60%),radial-gradient(900px 500px at 110% 110%,rgba(79,70,229,.25),transparent 60%),var(--bg)}
.lcard{width:100%;max-width:380px;background:var(--card);border-radius:24px;padding:32px 26px;box-shadow:var(--shadow)}
.logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;margin-bottom:18px;box-shadow:0 10px 24px rgba(79,70,229,.35)}
.lcard h1{margin:0 0 4px;font-size:24px;font-weight:800}
.lcard p{margin:0 0 22px;color:var(--muted)}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.fld input,.fld select{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);outline:none;transition:.15s}
.fld input:focus{border-color:var(--pri)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;font-weight:700;transition:.15s}
.btn-pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 8px 20px rgba(79,70,229,.3)}
.btn-pri:active{transform:scale(.98)}
.btn-ghost{background:var(--pri-soft);color:var(--pri)}
.btn-block{width:100%}
.err{color:var(--no);font-size:14px;min-height:20px;margin-top:10px}
.small{font-size:13px;color:var(--muted)}

/* ---------- top ---------- */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:860px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.brand .logo{width:34px;height:34px;border-radius:10px;margin:0;box-shadow:none}
.sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.datebar{display:flex;align-items:center;gap:8px;padding:0 16px 12px;max-width:860px;margin:0 auto}
.datebox{flex:1;font-size:14px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border-radius:14px;padding:9px 12px;box-shadow:var(--shadow);font-weight:700;position:relative}
.datebox input{position:absolute;inset:0;opacity:0;cursor:pointer}
.badge{white-space:nowrap;display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.b-toq{background:var(--late-soft);color:var(--late)}
.b-juft{background:var(--sab-soft);color:var(--sab)}

main{padding:16px 0 110px}
h2.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:700}

/* ---------- lesson cards ---------- */
.lesson{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:10px;width:100%;text-align:left;transition:.15s}
.lesson:active{transform:scale(.99)}
.para{width:54px;height:54px;border-radius:14px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:800;line-height:1.05;text-align:center;font-size:18px;flex-shrink:0}
.para small{display:block;font-size:10px;font-weight:700;opacity:.8}
.lesson .t{font-weight:800;font-size:17px}
.lesson .s{color:var(--muted);font-size:13px;margin-top:2px}
.st{margin-left:auto;flex-shrink:0}
.pill{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-wait{background:var(--late-soft);color:var(--late)}
.empty{background:var(--card);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gcard{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);text-align:left;transition:.15s}
.gcard:active{transform:scale(.98)}
.gcard .id{font-weight:800;font-size:20px}
.gcard .nm{color:var(--muted);font-size:12px;margin-top:2px;min-height:30px;line-height:1.3}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#22c55e)}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.kv b{color:var(--ink)}

/* ---------- attendance ---------- */
#att{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding-bottom:140px}
#yil{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-bottom:110px}
#yil.jedopen{padding-bottom:300px}
.jtbl th small{display:block;font-weight:600;font-size:10px;opacity:.8}
.jtbl th.jdim{color:#b0b4c6}
.jtbl th.jtoday{color:var(--pri)}
.jtbl td.jc{cursor:pointer;min-width:40px;padding:8px 4px;font-size:12px;border-left:1px solid var(--line)}
.jtbl td.jc b{margin-left:3px;font-size:14px;color:var(--ink)}
.jtbl td.jc:hover{background:var(--pri-soft)}
.jtbl th.jcs,.jtbl td.jcs{background:var(--ok-soft)}
.jtbl th.jcs{color:var(--ok)}
.jtbl td.jc.jcs{box-shadow:inset 2px 0 0 var(--ok),inset -2px 0 0 var(--ok)}
.jtbl td.jc.jcs.jdf{box-shadow:inset 0 -3px 0 var(--daf),inset 2px 0 0 var(--ok),inset -2px 0 0 var(--ok)}
.jtbl td.jdf{box-shadow:inset 0 -3px 0 var(--daf)}
.jtbl td.jed{background:color-mix(in srgb,#f5b400 24%,var(--card))}
.jtbl td.jsel{box-shadow:inset 0 0 0 2px var(--pri)!important}
#jed{position:fixed;left:0;right:0;bottom:0;z-index:58;padding:0 10px calc(10px + env(safe-area-inset-bottom))}
.jedin{max-width:640px;margin:0 auto;background:var(--card);border-radius:18px;box-shadow:0 -6px 30px rgba(10,12,30,.25);padding:12px 14px}
.jedh{display:flex;align-items:center;gap:8px}
.jedh b{font-size:15px}
#jed .row2{margin-top:8px}
.jednav{display:flex;gap:8px;margin-top:10px}
.jednav .btn{flex:1;padding:10px;font-size:13px}
#jed .seg button.on[data-js="+"]{background:var(--ok);color:#fff}
#jed .seg button.on[data-js="-"]{background:var(--no);color:#fff}
#jed .seg button.on[data-js="s"]{background:var(--sab);color:#fff}
#jed .seg button.on[data-js="k"]{background:var(--late);color:#fff}
#jed .dbtn[data-jclr]{margin-left:auto}
.jtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-4px 0 8px}
.jadd{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--pri);background:var(--pri-soft);border-radius:12px;padding:4px 4px 4px 10px}
.jadd input{height:30px;border:0;border-radius:9px;padding:0 6px;background:var(--card);color:var(--ink);font:inherit;font-size:12px}
.jcp{display:inline-flex;align-items:center;gap:4px;background:var(--ok-soft);border-radius:12px;padding:4px}
.jcp select{height:30px;border:0;border-radius:9px;padding:0 6px;background:var(--card);color:var(--ink);font:inherit;font-size:12px;font-weight:700}
.jcp button{height:30px;padding:0 10px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ok);white-space:nowrap}
.jcp button:hover{background:var(--card)}
.jtbl th[data-jcol]{cursor:pointer}
.jtbl th[data-jcol]:hover{background:var(--ok-soft);color:var(--ok)}
.jtbl td.jcpd,.jtbl th.jcpd{background-image:linear-gradient(var(--ok) 50%,transparent 50%),linear-gradient(var(--ok) 50%,transparent 50%);background-size:2px 8px;background-repeat:repeat-y;background-position:left top,right top}
.jtbl td.jrs{background-image:linear-gradient(rgba(79,70,229,.17),rgba(79,70,229,.17))}
.jtbl td.jrs.jcpd{background-image:linear-gradient(var(--ok) 50%,transparent 50%),linear-gradient(var(--ok) 50%,transparent 50%),linear-gradient(rgba(79,70,229,.17),rgba(79,70,229,.17));background-size:2px 8px,2px 8px,100% 100%;background-repeat:repeat-y,repeat-y,no-repeat;background-position:left top,right top,0 0}
.jtbl table{user-select:none;-webkit-user-select:none}
.jtbl td.jfl{background-image:linear-gradient(rgba(22,163,74,.2),rgba(22,163,74,.2))}
.jtbl td.jfhc{position:relative}
.jfh{position:absolute;right:-5px;bottom:-5px;width:9px;height:9px;background:var(--pri);border:1.5px solid var(--card);border-radius:2px;cursor:crosshair;z-index:1;touch-action:none}
.jfh::after{content:'';position:absolute;inset:-9px}
.jcolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--ok-soft);border-radius:12px;padding:6px 8px;margin:0 0 8px;font-size:13px}
.jcolbar button{height:30px;padding:0 10px;border-radius:9px;font-weight:700;font-size:13px;background:var(--card);color:var(--ok)}
.jcolbar button[data-cact="clr"]{color:var(--no)}
.jcolbar button[data-cact="x"]{margin-left:auto;color:var(--muted)}
.jcolbar kbd{font:inherit;font-size:10px;font-weight:600;opacity:.65;margin-left:2px}
.oystrip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:10px}
.oyc{flex:0 0 auto;min-width:104px;background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);text-align:left}
.oyc .m{font-size:12px;font-weight:700;color:var(--muted)}
.oyc b{display:block;font-size:18px;font-weight:800;margin:2px 0}
.oyc .bar{height:5px;margin:4px 0}
.oyc small{font-size:11px;color:var(--muted);font-weight:600}
.atthead{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.atthead .topin{padding-bottom:8px}
.atttitle{font-weight:800;font-size:18px}
.attsub{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:8px;padding:0 16px 12px;max-width:860px;margin:0 auto;flex-wrap:wrap}
.tools .btn{padding:9px 12px;font-size:13px}
.search{flex:1;min-width:140px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);outline:none}
.stu{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);margin-bottom:8px;border-left:5px solid transparent;transition:border-color .15s}
.stu.s-plus{border-left-color:var(--ok)} .stu.s-minus{border-left-color:var(--no)} .stu.s-s{border-left-color:var(--sab)} .stu.s-k{border-left-color:var(--late)}
.stu .row1{display:flex;align-items:center;gap:10px}
.num{width:26px;height:26px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0}
.nm{font-weight:700;line-height:1.25}
.nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.row2{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.stu.risk{background:var(--no-soft);box-shadow:0 0 0 1.5px var(--no) inset}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--bg);color:var(--muted)}
.tag.l5{background:var(--ok-soft);color:var(--ok)} .tag.l4{background:#e3ecfa;color:#2b579a} .tag.l3{background:#fff3e0;color:#ef6c00} .tag.l2{background:var(--no-soft);color:var(--no)}
.tag.risk{background:var(--no);color:#fff} .tag.rol{background:#fff1d6;color:#b45309}
.izoh{font-size:12px;color:var(--muted);margin-top:4px;font-style:italic;white-space:pre-wrap}
.mbtn{margin-left:auto;width:32px;height:32px;border-radius:10px;background:var(--bg);color:var(--muted);font-weight:900;font-size:18px;flex-shrink:0;display:grid;place-items:center}
.vbtn.on{background:var(--no)!important;color:#fff!important;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
.vbar{margin:8px 0 0;padding:10px 12px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:13px}
.vbar .tr{color:var(--muted);min-height:18px;font-style:italic}
.vbar .ap{margin-top:4px;font-weight:700}
.hist{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 12px}
.hist .hc{width:40px;border-radius:8px;padding:3px 0;text-align:center;font-size:10px;line-height:1.2;background:var(--bg);color:var(--muted)}
.hist .hc b{display:block;font-size:13px}
.hist .h-plus{background:var(--ok-soft);color:var(--ok)} .hist .h-minus{background:var(--no-soft);color:var(--no)} .hist .h-s{background:var(--sab-soft);color:var(--sab)} .hist .h-k{background:var(--late-soft);color:var(--late)} .hist .h-d{outline:2px solid var(--daf)}
.filt{padding:9px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:13px;color:var(--text)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{min-width:42px;height:38px;border-radius:9px;font-weight:800;font-size:16px;color:var(--muted)}
.seg button.on[data-s="+"]{background:var(--ok);color:#fff}
.seg button.on[data-s="-"]{background:var(--no);color:#fff}
.seg button.on[data-s="s"]{background:var(--sab);color:#fff}
.seg button.on[data-s="k"]{background:var(--late);color:#fff}
.grades{display:flex;gap:4px}
.grades button{width:38px;height:38px;border-radius:10px;background:var(--bg);font-weight:800;color:var(--muted)}
.grades button.on{background:var(--pri);color:#fff}
.dbtn{height:38px;padding:0 12px;border-radius:10px;background:var(--bg);font-weight:700;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.dbtn.on{background:var(--daf-soft);color:var(--daf);box-shadow:inset 0 0 0 1.5px var(--daf)}
.dbtn:disabled{opacity:.35}
.dbtn.qf.on{background:#fff3e0;color:#ef6c00;box-shadow:inset 0 0 0 1.5px #ef6c00}
#fotoBtn.on{background:#e8f5e9;color:#2e7d32}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.footin{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
.cnt{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.cnt span{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px}
.foot .btn{padding:13px 22px}

/* ---------- tabs ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabsin{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--pri)}

/* ---------- report ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px;font-weight:800}
.stat span{font-size:11px;color:var(--muted);font-weight:600}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.tblwrap{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:auto;max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);font-size:11px;color:var(--muted);font-weight:700;z-index:2}
td.l,th.l{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;max-width:190px;overflow:hidden;text-overflow:ellipsis}
th.l{z-index:3}
.c-ok{color:var(--ok);font-weight:800}.c-no{color:var(--no);font-weight:800}.c-s{color:var(--sab);font-weight:800}.c-k{color:var(--late);font-weight:800}.c-d{color:var(--daf);font-weight:800}
.chips{display:flex;gap:6px;overflow:auto;padding-bottom:4px;margin-bottom:12px}
.chip{padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:700;white-space:nowrap;font-size:13px}
.chip.on{background:var(--pri);color:#fff}
.seltabs{display:flex;background:var(--card);border-radius:12px;padding:3px;box-shadow:var(--shadow);margin-bottom:12px;width:max-content}
.seltabs button{padding:8px 14px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seltabs button.on{background:var(--pri-soft);color:var(--pri)}
.perbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.perbar select,.perbar input[type=date]{height:38px;padding:0 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:13px;box-shadow:var(--shadow)}
.perbar select.on,.perbar input.on{border-color:var(--pri);color:var(--pri);background:var(--pri-soft)}

/* ---------- schedule ---------- */
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:700px){.week{grid-template-columns:repeat(2,1fr)}}
.day{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.day h4{margin:0 0 8px;font-size:13px}
.day.today{box-shadow:0 0 0 2px var(--pri),var(--shadow)}
.slot{background:var(--bg);border-radius:10px;padding:7px 9px;margin-bottom:6px;font-size:12px}
.slot b{font-size:14px}
.slot.dim{opacity:.4}
.oybar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.oybar b{font-size:17px}

.oyd span i{position:absolute;right:0;top:3px;width:6px;height:6px;border-radius:50%;background:var(--pri)}
.oyd em{font-style:normal;font-size:10px;font-weight:700;background:var(--bg);border-radius:5px;padding:0 3px;white-space:nowrap;overflow:hidden}
.oyd.sun{opacity:.45}.oyd.dam{background:#fdecea;opacity:.7}.oyd.dam em{background:transparent;color:#e53935}.oyd.bugun{box-shadow:inset 0 0 0 2px var(--pri)}.oyd.sel{background:#e8ecff}
.oypanel{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:18px;display:flex;flex-direction:column;gap:8px}

.jrow select,.jrow input{width:100%;padding:8px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font-size:13px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#151827;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--pri);animation:sp 0.8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.sk{height:82px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),var(--line),var(--card));background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:10px}
@keyframes sh{to{background-position:-200% 0}}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

<script>
/* =============================================================
   Sozlama: Apps Script Web App URL shu yerga yozilsa, kirishda so'ralmaydi
   ============================================================= */
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbxEa3ESFb2i-PDxujZPGA_wvAoi2TPZ_XWVVrX50rZMfKZmGk2xBrdbQWnSA0o57nL4/exec';

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const LS = {
  get(k, d) { try { const v = localStorage.getItem('dv_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('dv_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('dv_' + k); } catch (e) {} }
};
const KUN = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
const KUNQ = ['Ya','Du','Se','Ch','Pa','Ju','Sh'];
const OY = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let API = DEFAULT_API || LS.get('api', '');
let TOKEN = LS.get('token', '');
let INIT = null;
let curDate = todayStr();
let curView = 'today';
let att = null;          // {guruh, sana, oquvchilar, dirty}
const STAT = {};         // guruh -> { normName: {kelmadi, sababli, daftarsiz, ortacha, bahoSoni, belgilar} }  (hisobotdan)
const SANA = {};         // guruh -> hisobotdagi sanalar ro'yxati (o'quvchi tarixi uchun)
const META = {};         // guruh -> { r: {rol, izoh} }  (yetakchi/sardor va izohlar)
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9а-яёўқғҳ]/g, '');
const lvl = st => !st || !st.bahoSoni ? null : st.ortacha >= 4.5 ? 5 : st.ortacha >= 3.5 ? 4 : st.ortacha >= 2.5 ? 3 : 2;
const RISK_N = 3;        // shuncha marta kelmagan yoki daftarsiz bo'lsa — qizil
const isRisk = st => !!st && ((st.kelmadi || 0) >= RISK_N || (st.daftarsiz || 0) >= RISK_N);

function todayStr() {
  const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Tashkent' }));
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parseD(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function fmtD(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return fmtD(d); }
function weekType(s) {
  const ref = parseD((INIT && INIT.toqRef) || '2026-09-28');
  const d = parseD(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd);
  const diff = Math.round((d - ref) / (7 * 864e5));
  return Math.abs(diff) % 2 === 0 ? 'toq' : 'juft';
}
function human(s) { const d = parseD(s); return KUN[d.getDay()] + ', ' + d.getDate() + '-' + OY[d.getMonth()]; }
function toast(t, ms = 2200) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), ms); }

/* ------------------------- API ------------------------- */
async function api(action, data = {}, tries = 2) {
  if (API === 'demo') return Demo.call(action, data);
  let j;
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action, token: TOKEN }, data)) });
    const txt = await r.text();
    j = JSON.parse(txt);            // Google band bo'lsa HTML qaytaradi — qayta urinib ko'ramiz
  } catch (e) {
    if (tries > 1 && action !== 'save') { await new Promise(r => setTimeout(r, 1500)); return api(action, data, tries - 1); }
    throw new Error(e instanceof SyntaxError ? "Server band — birozdan so'ng qayta urinib ko'ring" : e.message);
  }
  if (!j.ok) {
    if (j.error === 'AUTH') { logout(); throw new Error('Qaytadan kiring'); }
    throw new Error(j.error || 'Xatolik');
  }
  return j;
}

/* ------------------------- LOGIN ------------------------- */
function showLogin() {
  $('#login').classList.remove('hide'); $('#app').classList.add('hide');
  $('#apiFld').classList.toggle('hide', !!DEFAULT_API);
  $('#apiUrl').value = API && API !== 'demo' ? API : '';
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!DEFAULT_API) {

async function start() {
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  // Tez ochilish: avval saqlangan ma'lumot bilan darhol ko'rsatamiz, serverdan yangisini fonda olamiz

  else $('#v-today').innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  try {
    const fresh = await api('init');
    const changed = JSON.stringify(fresh.guruhlar) + JSON.stringify(fresh.jadval) !== (cached ? JSON.stringify(cached.guruhlar) + JSON.stringify(cached.jadval) : '');
    INIT = fresh; LS.set('init', INIT);
    if (!cached) { curDate = INIT.bugun || todayStr(); setDate(curDate); }
    else if (changed && $('#att').classList.contains('hide')) render();
  } catch (err) {
    if (!INIT) { toast(err.message); $('#v-today').innerHTML = `<div class="empty"><b>Ulanib bo'lmadi</b>${esc(err.message)}<br><br><button class="btn btn-pri" onclick="start()">Qayta urinish</button></div>`; return; }

}
// Bugungi darslar ro'yxatini fonda oldindan yuklab qo'yamiz — guruh bosilganda darhol ochiladi
let prefetched = {};
async function prefetchLessons(date) {
  if (!INIT || API === 'demo') return;
  const groups = [...new Set(lessonsFor(date).map(l => l.guruh))].filter(g => !prefetched[g + '|' + date]);
  const one = async g => {
    prefetched[g + '|' + date] = 1;
    try {
      const j = await api('lesson', { group: g, date }, 1);
      LS.set('les|' + g + '|' + date, j.oquvchilar);
      LS.set('stu|' + g, j.oquvchilar.map(o => ({ r: o.r, n: o.n, name: o.name })));
    } catch (e) { delete prefetched[g + '|' + date]; }
  };
  const q = groups.slice();
  await Promise.all([0, 1, 2].map(async () => { while (q.length) await one(q.shift()); }));
}

    const srv = Object.fromEntries((j.darslar || []).map(l => [key(l), l]));

// Umumiy dam olish kunlari: guruh '*' , hafta 'x:YYYY-MM-DD' yoki 'x:YYYY-MM-DD..YYYY-MM-DD'
function damKuni(date) {
  return INIT.jadval.some(j => { if (j.guruh !== '*' || !/^x:/.test(j.hafta)) return false; const [a, b] = j.hafta.slice(2).split('..'); return b ? date >= a && date <= b : date === a; });
}
function lessonsFor(date) {
  const d = parseD(date).getDay(), w = weekType(date);
  const nomi = Object.fromEntries((INIT.guruhlar || []).map(g => [g.id, g.nomi]));
  const order = r => ({ I: 1, II: 2, III: 3, IV: 4, V: 5 }[r] || 9);
  if (damKuni(date)) return [];
  const tugash = {};   // 1-semestr soati tugagan guruhlar: hafta = 'end:YYYY-MM-DD'
  INIT.jadval.forEach(j => { if (/^end:/.test(j.hafta)) tugash[j.guruh] = j.hafta.slice(4).split('..'); });   // end:oxirgiDars..semestrOxiri
  const bekor = new Set(INIT.jadval.filter(j => j.hafta === 'x:' + date).map(j => j.guruh + '|' + j.juftlik));
  return INIT.jadval.filter(j => (j.kun === d && (j.hafta === 'har' || j.hafta === w) && !bekor.has(j.guruh + '|' + j.juftlik) && !(tugash[j.guruh] && date > tugash[j.guruh][0] && (!tugash[j.guruh][1] || date <= tugash[j.guruh][1]))) || j.hafta === 'd:' + date)
    .map(j => Object.assign({ nomi: nomi[j.guruh] || '' }, j)).sort((a, b) => order(a.juftlik) - order(b.juftlik));
}
function lessonsHtml(list, live) {

  let h = `<h2 class="sec">${esc(human(curDate))} — darslar</h2>`;
  if (!list.length) h += `<div class="empty"><b>Bu kuni dars yo'q</b>${damKuni(curDate) ? 'Dam olish / ta\'til kuni' : parseD(curDate).getDay() === 0 ? 'Yakshanba — dam olish kuni' : 'Jadval bo\'yicha bu kunga dars belgilanmagan'}</div>`;
  list.forEach(l => {

    const st = p ? '<span class="pill" style="background:var(--no-soft);color:var(--no)">Yuborilmagan</span>'
      : live === null ? '' : l.belgilangan ? '<span class="pill p-ok">Belgilandi ✓</span>' : '<span class="pill p-wait">Kutilmoqda</span>';
    h += `<button class="lesson" data-g="${esc(l.guruh)}">

      <div><div class="t">${esc(l.guruh)} <span style="font-weight:600;color:var(--muted);font-size:13px">${esc(l.nomi)}</span></div>
      <div class="s">${esc(l.vaqt || '')}${l.xona ? ' · ' + esc(l.xona) : ''}${l.hafta === 'toq' || l.hafta === 'juft' ? ' · faqat ' + l.hafta + ' hafta' : /^d:/.test(l.hafta) ? ' · qo\'shimcha dars' : ''}${l.oquvchiSoni ? ' · ' + l.oquvchiSoni + " o'quvchi" : ''}</div></div>

  h += `<h2 class="sec">Boshqa guruh</h2><div class="chips">` +
    INIT.guruhlar.map(g => `<button class="chip" data-g="${esc(g.id)}">${esc(g.id)}</button>`).join('') + '</div>';
  return h;
}

let rec = null, recOn = false;
const CYR = { а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'yo',ж:'j',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'x',ц:'s',ч:'ch',ш:'sh',щ:'sh',ъ:'',ы:'i',ь:'',э:'e',ю:'yu',я:'ya',ў:'o',қ:'q',ғ:'g',ҳ:'h' };
const vnorm = w => String(w || '').toLowerCase().replace(/[а-яёўқғҳ]/g, ch => CYR[ch] ?? ch).replace(/ʻ|ʼ|'|’|`|‘/g, '').replace(/x/g, 'h').replace(/[^a-z0-9]/g, '');
function lev(a, b) { const m = a.length, n = b.length; if (!m || !n) return m + n; let p = Array.from({ length: n + 1 }, (_, i) => i); for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[n]; }
const VCMD = [
  [/^(yoq|yuq|kelmadi|kelmagan|minus|net|otsutstvuet)$/, o => { o.s = '-'; o.b = ''; o.d = false; return 'kelmadi'; }],
  [/^(sababli|sabab|uvajitelno|uvajitelnaya)$/, o => { o.s = 's'; o.b = ''; o.d = false; return 'sababli'; }],
  [/^(kech|kechikdi|kechikkan|kechikib|opozdal)$/, o => { o.s = 'k'; return 'kechikdi'; }],
  [/^(keldi|bor|plyus|plus|prisutstvuet|kelgan)$/, o => { o.s = '+'; return 'keldi'; }],
  [/^(daftar|daftarsiz|dafter|tetrad|tetradi)$/, o => { if (!o.s || o.s === '-' || o.s === 's') o.s = '+'; o.d = true; return "daftar yo'q"; }],
  [/^(besh|5|pyat)$/, o => { if (!o.s) o.s = '+'; o.b = 5; return 'baho 5'; }],
  [/^(tort|turt|4|chetire|chetyre)$/, o => { if (!o.s) o.s = '+'; o.b = 4; return 'baho 4'; }],
  [/^(uch|3|tri)$/, o => { if (!o.s) o.s = '+'; o.b = 3; return 'baho 3'; }],
  [/^(ikki|2|dva)$/, o => { if (!o.s) o.s = '+'; o.b = 2; return 'baho 2'; }],
];
function vMatch(tok) {   // so'zni o'quvchiga moslash (familiya yoki ism bo'yicha)
  if (!att || tok.length < 3) return null;
  let best = null, bd = 9;
  att.oquvchilar.forEach(o => {
    const parts = o.name.split(/\s+/).slice(0, 2).map(vnorm).filter(Boolean);
    parts.forEach((p, pi) => {
      let d = lev(tok, p); if (tok.length >= 4 && p.startsWith(tok)) d = Math.min(d, 1); if (p.length >= 4 && tok.startsWith(p)) d = Math.min(d, 1);
      const lim = p.length >= 8 ? 3 : p.length >= 5 ? 2 : 1;
      d += pi * 0.5;   // familiya ismdan ustun
      if (d <= lim && d < bd) { bd = d; best = o; }
    });
  });
  return best;
}
function applyVoice(text) {
  const toks = text.split(/\s+/).map(vnorm).filter(Boolean), done = [];
  if (/hammasikeldi|hammakeldi|barchasikeldi/.test(toks.join(''))) { att.oquvchilar.forEach(o => { if (!o.s) o.s = '+'; }); done.push('hammasi keldi'); }
  let cur = null, acts = [];
  const flush = () => { if (cur && acts.length) done.push(cur.name.split(' ').slice(0, 2).join(' ') + ' → ' + acts.join(', ')); acts = []; };
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (t === 'daftar' && toks[i + 1] && /^(yoq|yuq)$/.test(toks[i + 1])) { if (cur) { acts.push(VCMD[4][1](cur)); } i++; continue; }
    const cmd = VCMD.find(([re]) => re.test(t));
    if (cmd && cur) { acts.push(cmd[1](cur)); continue; }
    const o = vMatch(t);
    if (o) { flush(); cur = o; continue; }
  }
  flush();
  if (done.length) {
    att.oquvchilar.forEach(o => { if (o.s === '-' || o.s === 's' || o.s === '') { o.f = false; o.q = false; } });
    att.dirty = att.touched = true; saveQF(); saveDraft(); drawAtt();
    $('#voiceAp').textContent = '✓ ' + done.join(' · ');
    if (navigator.vibrate) navigator.vibrate(40);
  } else $('#voiceAp').textContent = "Tushunmadim — familiyani aniqroq ayting";
}
function stopVoice() { recOn = false; try { rec && rec.stop(); } catch (e) {} $('#voiceBtn').classList.remove('on'); $('#voiceBtn').textContent = '🎤 Ovoz'; }
$('#voiceBtn').onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast("Bu brauzerda ovozli kiritish yo'q — Chrome yoki Safari'da oching", 3500);
  if (recOn) return stopVoice();
  if (!att) return;
  rec = new SR(); rec.lang = 'uz-UZ'; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
  rec.onresult = e => {
    let fin = '', inter = '';
    for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t + ' '; else inter += t; }
    $('#voiceTr').textContent = (fin || inter).trim() || '…';
    if (fin.trim() && att) applyVoice(fin);
  };
  rec.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { toast('Mikrofonga ruxsat bering (brauzer sozlamalari)', 3500); stopVoice(); } else if (e.error === 'language-not-supported') { rec.lang = 'ru-RU'; } };
  rec.onend = () => { if (recOn) { try { rec.start(); } catch (e) {} } };
  recOn = true; $('#voiceBar').classList.remove('hide'); $('#voiceBtn').classList.add('on'); $('#voiceBtn').textContent = '⏹ To\'xtatish'; $('#voiceAp').textContent = '';
  try { rec.start(); } catch (e) { toast(e.message); stopVoice(); }
};

function tgRasm(g, date, list) {
  const kel = list.filter(o => o.s === '+' || o.s === 'k'), yoq = list.filter(o => o.s === '-'), sab = list.filter(o => o.s === 's'), kech = list.filter(o => o.s === 'k');
  const nm = o => o.name.split(' ').slice(0, 2).join(' ');
  const forma = list.filter(o => o.f && (o.s === '+' || o.s === 'k')), qurol = list.filter(o => o.q && (o.s === '+' || o.s === 'k'));
  const RH = 58, T0 = 500;
  const W = 1080, H = T0 + list.length * RH + 70;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const F = (w, z) => x.font = (w ? 'bold ' : '') + z + 'px system-ui,Segoe UI,Arial';
  x.fillStyle = '#f4f6fb'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#3d5afe'; x.fillRect(0, 0, W, 170);
  x.fillStyle = '#fff'; F(1, 54); x.fillText(g.split(' ')[0] + ' guruh — davomat', 60, 85);
  const d = parseD(date);
  F(0, 32); x.fillText(KUN[d.getDay()] + ', ' + d.getDate() + '-' + OY[d.getMonth()] + ' ' + d.getFullYear() + ' · ' + KUNLIK[g].para, 60, 140);
  const box = (bx, w, label, val, col) => {
    x.fillStyle = '#fff'; x.beginPath(); x.roundRect(bx, 200, w, 170, 24); x.fill();
    x.fillStyle = col; F(1, 80); x.textAlign = 'center'; x.fillText(val, bx + w / 2, 300);
    x.fillStyle = '#5b6275'; F(0, 26); x.fillText(label, bx + w / 2, 345); x.textAlign = 'left';
  };
  box(40, 235, 'Jami', list.length, '#151827'); box(295, 235, 'Keldi', kel.length, '#2e7d32'); box(550, 235, 'Kelmadi', yoq.length + sab.length, '#e53935');
  box(805, 235, 'Formasiz / qurolsiz', forma.length + '/' + qurol.length, '#ef6c00');
  // jadval sarlavhasi
  const C = { n: 50, nm: 110, st: 640, f: 860, q: 980 };
  x.fillStyle = '#151827'; F(1, 26);
  x.fillText('№', C.n, T0 - 40); x.fillText("O'quvchi", C.nm, T0 - 40); x.fillText('Davomat', C.st, T0 - 40);
  x.textAlign = 'center'; x.fillText('Forma', C.f, T0 - 40); x.fillText('Qurol', C.q, T0 - 40); x.textAlign = 'left';
  const ST = { '+': ['Keldi', '#2e7d32', '#e8f5e9'], 'k': ['Kechikdi', '#e53935', '#ffebee'], '-': ['Kelmadi', '#e53935', '#ffebee'], 's': ['Sababli', '#1e88e5', '#e3f2fd'], '': ['—', '#8a90a2', '#eef0f5'] };
  list.forEach((o, i) => {
    const y = T0 + i * RH, st = ST[o.s] || ST[''], here = o.s === '+' || o.s === 'k';
    x.fillStyle = i % 2 ? '#f4f6fb' : '#fff'; x.fillRect(30, y - 10, W - 60, RH);
    const cy = y + RH / 2 - 10;
    x.fillStyle = '#5b6275'; F(0, 26); x.fillText(String(o.n || i + 1), C.n, cy + 9);
    const qizil = o.s === 'k' || (here && o.f);
    x.fillStyle = qizil ? '#e53935' : here ? '#151827' : st[1]; F(qizil ? 1 : 0, 30); x.fillText(nm(o).slice(0, 30), C.nm, cy + 10);
    x.fillStyle = st[2]; x.beginPath(); x.roundRect(C.st - 10, cy - 20, 160, 40, 20); x.fill();
    x.fillStyle = st[1]; F(1, 24); x.textAlign = 'center'; x.fillText(st[0], C.st + 70, cy + 8);
    F(1, 30);
    if (here) {
      x.fillStyle = o.f ? '#e53935' : '#2e7d32'; x.fillText(o.f ? '✗' : '✓', C.f, cy + 10);
      x.fillStyle = o.q ? '#e53935' : '#2e7d32'; x.fillText(o.q ? '✗' : '✓', C.q, cy + 10);
    } else { x.fillStyle = '#b0b5c3'; x.fillText('—', C.f, cy + 10); x.fillText('—', C.q, cy + 10); }
    x.textAlign = 'left';
  });
  x.fillStyle = '#8a90a2'; F(0, 22); x.fillText('✓ bor   ✗ yo\'q   · Davomat — Mashrapov Q.', 50, H - 25);
  const cap = g.split(' ')[0] + ' · ' + human(date) + ' · ' + KUNLIK[g].para + '\nJami: ' + list.length + ' | Keldi: ' + kel.length + ' | Kelmadi: ' + (yoq.length + sab.length) +
    (yoq.length ? '\nKelmadi: ' + yoq.map(nm).join(', ') : '') + (sab.length ? '\nSababli: ' + sab.map(nm).join(', ') : '') + (kech.length ? '\nKechikdi: ' + kech.map(nm).join(', ') : '') +
    (forma.length ? '\nForma yo\'q: ' + forma.map(nm).join(', ') : '') + (qurol.length ? '\nO\'quv quroli yo\'q: ' + qurol.map(nm).join(', ') : '');
  return { cv, cap };
}
async function tgYubor(g, date, list, foto) {
  const c = tgCfg();
  if (!c.token || !c.chat) { toast("Telegram sozlanmagan — yuqoridagi ✈ tugmasini bosing", 3500); return; }
  try {
    const { cv, cap } = tgRasm(g, date, list);
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const chats = String(c.chat).split(/[,;\s]+/).filter(Boolean);
    toast('Telegramga yuborilmoqda…', 2000);
    const natija = [];
    for (const chat of chats) {
    const fd = new FormData(); fd.append('chat_id', chat);
    let method = 'sendPhoto';
    if (foto) {
      method = 'sendMediaGroup';
      fd.append('media', JSON.stringify([{ type: 'photo', media: 'attach://hisobot', caption: cap.slice(0, 1000) }, { type: 'photo', media: 'attach://guruh' }]));
      fd.append('hisobot', blob, g + '_' + date + '.png'); fd.append('guruh', foto, foto.name || 'guruh.jpg');
    } else { fd.append('caption', cap.slice(0, 1000)); fd.append('photo', blob, g + '_' + date + '.png'); }
    const j = await (await fetch('https://api.telegram.org/bot' + c.token + '/' + method, { method: 'POST', body: fd })).json();
    natija.push(j.ok ? null : chat + ': ' + (j.description || 'xato'));
    }
    const xato = natija.filter(Boolean);
    toast(!xato.length ? (chats.length > 1 ? chats.length + ' ta guruhga yuborildi ✓' : 'Telegram guruhiga yuborildi ✓') : 'Telegram xatosi: ' + xato.join('; '), 4500);
  } catch (e) { toast("Telegramga yuborib bo'lmadi: " + e.message, 3500); }
}

function perMatch(d, per) {

  const repIso = j0.sanalar.map(isoOf);

  yilExtra.forEach(d => set.add(d));
  Object.keys(yilEdits).forEach(k => set.add(k.split('|')[1]));
  const iso = [...set].sort();

  const oq = j0.oquvchilar.map(o => {

    pend.forEach(x => { const k = x.marks.find(k => String(nOfR[k.r]) === String(o.n)); if (k) m[x.date] = [(k.s || '') + (k.d && (k.s === '+' || k.s === 'k') ? 'd' : ''), k.b ?? '']; });

// Qo'yilgan matndagi bitta qiymat: «+5», «+», «−», «-», «S», «K4», «5», «+d5» ... -> {s, b, d}; tanilmasa null
function yilParse(t) {
  t = String(t ?? '').trim().toUpperCase().replace(/\s+/g, '');
  if (!t) return { s: '', b: '', d: false };
  const d = /[DД]/.test(t); t = t.replace(/[DД]/g, '');
  const m = t.match(/^([+✓V\-−–—NНSСKК]?)([2-5])?$/); if (!m) return null;
  let s = { '+': '+', '✓': '+', V: '+', '-': '-', '−': '-', '–': '-', '—': '-', N: '-', 'Н': '-', S: 's', 'С': 's', K: 'k', 'К': 'k' }[m[1]] || '';
  if (!s && (m[2] || d)) s = '+';
  return { s, b: m[2] ? +m[2] : '', d };
}
// Bitta katakka yozish (tahrirlar ro'yxatiga; asl qiymatga qaytsa — tahrir o'chadi) — qiymat o'zgargan bo'lsa true
function yilWrite(o, iso, s, b, d) {
  const i = yilJ.iso.indexOf(iso); if (i < 0) return false;
  s = s || ''; b = b ?? ''; d = !!d;
  const cur = yilCell(o.belgilar[i]), [bc, bb] = o.base[i], bs = String(bc || ''), key = o.n + '|' + iso;
  if (bs.replace('d', '') === s && bs.includes('d') === d && String(bb ?? '') === String(b)) delete yilEdits[key]; else yilEdits[key] = { s, b, d };
  return !(cur.s === s && cur.d === d && String(cur.b) === String(b));
}
// Qo'yilgan qiymatni to'g'rilab yozish (baho bor — «keldi»; «−»/«S» — bahosiz)
function yilPut(o, iso, s, b, d) {
  s = s || ''; b = b === '' || b == null ? '' : +b; d = !!d;
  if (s === '-' || s === 's') b = '';

}

// Ctrl+V: tanlangan ustunga (1-qatordan) yoki tanlangan katakdan boshlab pastga/o'ngga — Excel'dagidek
function yilPaste(txt) {
  const J = yilJ, vis = yilIdx(J).map(i => J.iso[i]);
  if (!jedSel && (yilColSel === 'name' || yilColSel === 'avg')) return toast("Bu ustunga qo'yib bo'lmaydi — sana ustunini tanlang", 3000);
  const R = yilRect(); if (!R) return toast("Avval katak(lar)ni yoki sana ustunini belgilang, keyin Ctrl+V", 3000);
  const r0 = R.r1, c0 = R.c1, multi = yilRectN(R) > 1;
  txt = String(txt || '').replace(/\r\n?/g, '\n');
  if (!txt) return toast("Clipboard bo'sh — avval nusxa oling");
  let rows;
  if (yilClipBuf && yilClipBuf.text === txt) rows = yilClipBuf.cells;   // sayt ichidan nusxa — daftar belgisi bilan
  else {
    const lines = txt.split('\n'); if (lines.length > 1 && lines[lines.length - 1] === '') lines.pop();
    let grid = lines.map(l => l.split('\t'));
    // «Jadvalni nusxalash»dagi sarlavha qatori bo'lsa — faqat sana ustunlarini olamiz (№, F.I.Sh., O'rt. tashlanadi)
    const isDH = v => /^\s*\d{2}\.\d{2}(\.\d{4})?\s*$/.test(v);
    if (grid.length > 1 && grid[0].some(v => /^\s*(№|F\.I\.Sh\.?)\s*$/i.test(v) || isDH(v))) {
      const keep = grid[0].map((v, k) => isDH(v) ? k : -1).filter(k => k >= 0);
      grid = grid.slice(1).map(r => keep.map(k => r[k] ?? ''));
      if (!keep.length) return toast("Qo'yilgan jadvalda sana ustunlari topilmadi", 3000);
    }
    rows = grid.map(r => r.map(yilParse));

  if (multi && rows.length === 1 && rows[0].length === 1) {   // 1 qiymat — belgilangan barcha kataklarga
    const v = rows[0][0]; rows = []; for (let r = R.r1; r <= R.r2; r++) rows.push(Array(R.c2 - R.c1 + 1).fill(v));
  }
  yilSnap();
  let n = 0, bad = 0, cut = 0; const used = new Set();
  rows.forEach((r, ri) => {
    const o = J.oquvchilar[r0 + ri]; if (!o) { cut += r.length; return; }
    r.forEach((v, ci) => {
      const iso = vis[c0 + ci]; if (!iso) { cut++; return; }
      if (!v) { bad++; return; }
      used.add(iso); if (yilPut(o, iso, v.s, v.b, v.d)) n++;

  });
  if (!n) yilUndo.pop();
  yilEdSave(); drawYil(); if (jedSel) jedDraw();
  const where = [...used].sort().map(d => d.slice(8) + '.' + d.slice(5, 7)).join(', ');
  toast((n ? `Qo'yildi ✓ — ${n} katak o'zgardi${where ? ' (' + where + ')' : ''}. «Saqlash»ni bosing · Ctrl+Z — bekor` : "Qo'yildi — hech narsa o'zgarmadi") +
    (bad ? ` · ${bad} ta qiymat tanilmadi` : '') + (cut ? ` · ${cut} ta ortiqcha qiymat sig'madi` : ''), 4500);
}

        <select data-k="hafta">${opt([['har', 'Har hafta'], ['toq', 'Toq'], ['juft', 'Juft']], r.hafta)}</select>
        <button class="iconbtn" data-del title="O'chirish">✕</button></div>`).join('') +
      `<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn btn-ghost" id="addRow">+ Qator</button><div class="sp"></div>
       <button class="btn" id="cancelSched" style="background:var(--card)">Bekor qilish</button><button class="btn btn-pri" id="saveSched">Saqlash</button></div>`;
    box.querySelectorAll('.jrow[data-i]').forEach(rw => {
      const i = +rw.dataset.i;
      rw.querySelectorAll('[data-k]').forEach(inp => inp.onchange = () => { rows[i][inp.dataset.k] = inp.dataset.k === 'kun' ? +inp.value : inp.value; });
      rw.querySelector('[data-del]').onclick = () => { rows.splice(i, 1); draw(); };
    });
    $('#addRow').onclick = () => { rows.push({ guruh: INIT.guruhlar[0].id, kun: 1, juftlik: 'I', vaqt: '08:30-09:50', xona: '', hafta: 'har' }); draw(); };
    $('#cancelSched').onclick = () => { schedEdit = false; renderSched(); };
    $('#saveSched').onclick = async () => {
      try { const j = await api('saveJadval', { rows: rows.concat(extra) }); INIT.jadval = j.jadval; LS.set('init', INIT); schedEdit = false; toast('Jadval saqlandi ✓'); renderSched(); }
      catch (e) { toast(e.message); }
    };
  };
  draw();
}

/* =============================================================

const Demo = (() => {
  const G = [['01-26', 'Zargar (dual)'], ['02-26', 'Kompyuter'], ['03-26', 'Grafik va dizayn texnologiyasi'], ['04-26', 'Kompyuter tarmoqlari va IT-servis'], ['05-26', 'Avtomobillar servisi (dual)'],
    ['06-26', ''], ['07-26', ''], ['08-26', 'Moda va tikuv (dual)'], ['09-26', 'Sartarosh'], ['10-26', ''], ['10-25', "O't o'chiruvchi"], ['05-25 I', 'Guruh rahbari - I para'], ['05-25 II', 'Guruh rahbari - II para'], ['05-25 III', 'Guruh rahbari - III para']];
  const J = [['01-26', 2, 'II', 'har'], ['01-26', 4, 'I', 'har'], ['01-26', 5, 'II', 'juft'], ['02-26', 4, 'II', 'har'], ['03-26', 6, 'I', 'har'], ['04-26', 3, 'I', 'har'], ['05-26', 5, 'I', 'har'], ['05-26', 6, 'II', 'har'],
    ['06-26', 1, 'I', 'har'], ['06-26', 2, 'I', 'har'], ['07-26', 3, 'III', 'toq'], ['07-26', 4, 'III', 'har'], ['07-26', 5, 'III', 'har'], ['08-26', 1, 'II', 'har'], ['08-26', 2, 'III', 'har'], ['09-26', 6, 'III', 'har'], ['10-26', 3, 'II', 'har'], ['10-25', 1, 'III', 'juft'], ['05-25 I', 1, 'I', 'har'], ['05-25 II', 1, 'II', 'har'], ['05-25 III', 1, 'III', 'har'], ['05-25 I', 2, 'I', 'har'], ['05-25 II', 2, 'II', 'har'], ['05-25 III', 2, 'III', 'har'], ['05-25 I', 3, 'I', 'har'], ['05-25 II', 3, 'II', 'har'], ['05-25 III', 3, 'III', 'har'], ['05-25 I', 4, 'I', 'har'], ['05-25 II', 4, 'II', 'har'], ['05-25 III', 4, 'III', 'har'], ['05-25 I', 5, 'I', 'har'], ['05-25 II', 5, 'II', 'har'], ['05-25 III', 5, 'III', 'har'], ['05-25 I', 6, 'I', 'har'], ['05-25 II', 6, 'II', 'har'], ['05-25 III', 6, 'III', 'har']];
  const V = { I: '08:30-09:50', II: '10:00-11:20', III: '11:30-12:50' };
  const names = ['Abduraximov Saidalo Rustam o\'g\'li', 'Ashirboyev Abdulloh Shahriddin o\'g\'li', 'Baxtiyarova Bekzoda Boxodir qizi', 'Ergasheva Mubina Anvar qizi', 'Ikramov Azamat Jonibek o\'g\'li', 'Karimov Zoxirshoh Kamoliddin o\'g\'li', 'Minasyan David Vyacheslavovich', 'Mirolimova Mohinur Kamoliddin qizi', 'Nosirov Farrux Doniyorovich', 'Odilov Muhammadrizo Shoikrom o\'g\'li', 'Qodirova Aziza Muslimjon qizi', 'Saidov Abdulloh Muxlis o\'g\'li'];
  const store = {}, meta = {};
  let jadval = J.map(([g, k, j, h]) => ({ guruh: g, kun: k, juftlik: j, vaqt: V[j], xona: '310-xona', hafta: h }));
  const wait = () => new Promise(r => setTimeout(r, 250));
  const rep = g => {
    const dates = Object.keys(store).filter(k => k.startsWith(g + '|')).map(k => k.split('|')[1]).sort();
    const S = names.map((n, i) => {
      const st = { n: i + 1, name: n, keldi: 0, kelmadi: 0, sababli: 0, kechikdi: 0, daftarsiz: 0, bahoSoni: 0, ortacha: null, belgilar: [] }; let sum = 0;
      dates.forEach(d => { const m = store[g + '|' + d][i] || {}; const key = { '+': 'keldi', '-': 'kelmadi', s: 'sababli', k: 'kechikdi' }[m.s]; if (key) st[key]++; if (m.d) st.daftarsiz++; if (m.b) { st.bahoSoni++; sum += +m.b; } st.belgilar.push([(m.s || '') + (m.d ? 'd' : ''), m.b || '']); });
      st.ortacha = st.bahoSoni ? Math.round(sum / st.bahoSoni * 10) / 10 : null; return st;
    });
    return { guruh: g, sanalar: dates.map(d => d.slice(8) + '.' + d.slice(5, 7)), oquvchilar: S };
  };
  const xul = g => { const r = rep(g); let a = 0, b = 0, s = 0, n = 0, f = 0; r.oquvchilar.forEach(o => { a += o.keldi + o.kechikdi + o.kelmadi + o.sababli; b += o.keldi + o.kechikdi; f += o.daftarsiz; if (o.ortacha) { s += o.ortacha * o.bahoSoni; n += o.bahoSoni; } });
    return { guruh: g, nomi: (G.find(x => x[0] === g) || [])[1], oquvchiSoni: names.length, darslar: r.sanalar.length, sanalar: r.sanalar, davomat: a ? Math.round(b / a * 1000) / 10 : null, ortacha: n ? Math.round(s / n * 10) / 10 : null, daftarsiz: f }; };
  return {
    async call(a, d) {
      await wait();
      if (a === 'init') return { ok: true, bugun: todayStr(), toqRef: '2026-09-28', guruhlar: G.map(([id, nomi]) => ({ id, nomi, url: '' })), jadval };
      if (a === 'day') { const wd = parseD(d.date).getDay(), w = weekType(d.date); const key = d.date.slice(8) + '.' + d.date.slice(5, 7);
        return { ok: true, sana: d.date, darslar: jadval.filter(j => j.kun === wd && (j.hafta === 'har' || j.hafta === w)).map(j => Object.assign({ nomi: (G.find(x => x[0] === j.guruh) || [])[1], belgilangan: !!store[j.guruh + '|' + d.date], oquvchiSoni: names.length }, j)) }; }
      if (a === 'lesson') { const s = store[d.group + '|' + d.date] || []; return { ok: true, oquvchilar: names.map((n, i) => ({ r: i + 3, n: i + 1, name: n, s: (s[i] || {}).s || '', b: (s[i] || {}).b || '', d: !!(s[i] || {}).d })) }; }
      if (a === 'save') { store[d.group + '|' + d.date] = d.marks.map(m => ({ s: m.s, b: m.b, d: m.d })); return { ok: true, saqlandi: d.marks.length }; }
      if (a === 'overview') return { ok: true, guruhlar: G.map(([g]) => xul(g)) };
      if (a === 'report') return Object.assign({ ok: true }, rep(d.group));
      if (a === 'saveJadval') { jadval = d.rows; return { ok: true, jadval }; }
      if (a === 'addStudent') { names.push(d.name); return { ok: true, r: names.length + 2, n: names.length }; }
      if (a === 'getMeta') return { ok: true, items: Object.entries(meta[d.group] || {}).map(([r, v]) => Object.assign({ r: +r }, v)) };
      if (a === 'saveMeta') { (meta[d.group] = meta[d.group] || {})[d.r] = { rol: d.rol, izoh: d.izoh }; return { ok: true }; }
      return { ok: true };
    }
  };
})();
